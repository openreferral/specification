name: Test Examples (JSON Schema)
on: [push, pull_request]

jobs:
  test_examples_json_schema:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11
        architecture: x64
    - run: sudo apt-get install python3-dev graphviz libgraphviz-dev pkg-config
    - run: pip install -r requirements.txt
    #- run: ./validate_examples_json_schema.sh
    - run: check-jsonschema --schemafile schema/location.json examples/location.json
    - run: check-jsonschema --schemafile schema/organization.json examples/organization_full.json
    - run: check-jsonschema --schemafile schema/service_at_location.json examples/service_at_location_full.json
    - run: check-jsonschema --schemafile schema/service.json examples/service_full.json
    - run: check-jsonschema --schemafile schema/taxonomy.json examples/taxonomy.json
    - run: check-jsonschema --schemafile schema/taxonomy_term.json examples/taxonomy_term.json
